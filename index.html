<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>骰揀 Pick For You - 香港美食速選與配對平台</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@600;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            coral: '#FF5A36',
                            coralHover: '#E04826',
                            teal: '#0D9488',
                            tealLight: '#CCFBF1',
                            rose: '#E11D48',
                            roseLight: '#FFE4E6',
                            amber: '#F59E0B',
                            amberLight: '#FEF3C7',
                            paperBg: '#F5F3EF',
                            darkBg: '#0E1117',
                            cardDark: '#1E2430',
                            ink: '#18181B'
                        }
                    },
                    boxShadow: {
                        'neo': '0 6px 0 #18181B',
                        'neo-sm': '0 3px 0 #18181B',
                        'neo-lg': '0 10px 0 #18181B',
                        'neo-dark': '0 6px 0 #FFFFFF',
                        'neo-sm-dark': '0 3px 0 #FFFFFF'
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'Inter', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Noto Sans TC', Inter, sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Tactile Ticket Machine & Zine Texture */
        .zine-bg {
            background-color: #F5F3EF;
            background-image: radial-gradient(#18181B 0.75px, transparent 0.75px);
            background-size: 16px 16px;
            background-position: 0 0;
        }

        .dark .zine-bg {
            background-color: #0E1117;
            background-image: radial-gradient(#374151 0.75px, transparent 0.75px);
        }

        .ticket-edge {
            background-image: radial-gradient(circle at bottom, transparent 6px, #ffffff 6.5px);
            background-size: 16px 100%;
        }

        .dark .ticket-edge {
            background-image: radial-gradient(circle at bottom, transparent 6px, #1E2430 6.5px);
        }

        /* Hard Offset Button Animations */
        .btn-neo {
            border: 2px solid #18181B;
            box-shadow: 0 4px 0 #18181B;
            transition: all 0.1s ease;
        }
        .btn-neo:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #18181B;
        }
        
        .dark .btn-neo {
            border-color: #F3F4F6;
            box-shadow: 0 4px 0 #F3F4F6;
        }
        .dark .btn-neo:active {
            box-shadow: 0 0px 0 #F3F4F6;
        }

        /* Card Deck Animations & Gestures */
        .swipe-card {
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s ease;
            will-change: transform, opacity;
        }

        .swipe-card.dragging {
            transition: none !important;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #18181B;
            border-radius: 999px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #9CA3AF;
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes diceShake {
            0% { transform: scale(1) rotate(0deg); }
            20% { transform: scale(1.15) rotate(-12deg); }
            40% { transform: scale(1.15) rotate(12deg); }
            60% { transform: scale(1.2) rotate(-8deg); }
            80% { transform: scale(1.2) rotate(8deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .animate-dice {
            animation: diceShake 0.4s ease-in-out infinite;
        }
    </style>
</head>
<body class="zine-bg min-h-screen text-brand-ink dark:text-gray-100 flex flex-col justify-between transition-colors duration-200">
    
    <!-- Canvas Overlay for Confetti Celebrations -->
    <canvas id="confetti-canvas"></canvas>

    <!-- MAIN APP CONTAINER -->
    <div class="max-w-md w-full mx-auto min-h-screen flex flex-col px-4 py-4 relative">
        
        <!-- HEADER -->
        <header class="flex items-center justify-between mb-4 bg-white dark:bg-brand-cardDark border-2 border-brand-ink dark:border-gray-100 p-3 rounded-2xl shadow-neo dark:shadow-neo-dark transition-all">
            <div class="flex items-center gap-2">
                <div class="bg-brand-coral text-white font-black px-2.5 py-1 rounded-lg border-2 border-brand-ink text-sm shadow-[0_2px_0_#18181B] flex items-center gap-1.5">
                    <span class="text-base">🎲</span> PICK FOR YOU
                </div>
                <span class="bg-brand-ink text-white dark:bg-gray-100 dark:text-brand-ink font-bold text-xs px-2 py-1 rounded-md tracking-widest">
                    骰揀
                </span>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- Back to Setup (Shown when not in Setup screen) -->
                <button id="btn-back-setup" onclick="resetToSetup()" class="hidden text-xs font-bold px-2.5 py-1.5 bg-gray-100 dark:bg-gray-800 border-2 border-brand-ink dark:border-gray-200 rounded-xl hover:bg-gray-200 active:translate-y-0.5 transition-all">
                    ⚙️ 重新設定
                </button>
                
                <!-- Dark Mode Toggle Button -->
                <button id="theme-toggle" onclick="toggleDarkMode()" title="切換深淺模式" class="w-9 h-9 flex items-center justify-center rounded-xl border-2 border-brand-ink dark:border-gray-100 bg-amber-300 dark:bg-indigo-900 text-lg hover:scale-105 active:scale-95 transition-all">
                    <span class="dark:hidden">☀️</span>
                    <span class="hidden dark:inline">🌙</span>
                </button>
            </div>
        </header>

        <!-- SCREEN 1: SETUP SCREEN -->
        <main id="screen-setup" class="flex-1 flex flex-col justify-between gap-4">
            
            <!-- Hero / Mode Switcher Box -->
            <div class="bg-white dark:bg-brand-cardDark border-2 border-brand-ink dark:border-gray-100 p-5 rounded-2xl shadow-neo dark:shadow-neo-dark">
                <div class="text-center mb-4">
                    <h1 class="text-2xl font-black tracking-tight text-brand-ink dark:text-white flex items-center justify-center gap-2">
                        <span>今日食乜好？</span>
                        <span class="text-brand-coral">一甩即決！</span>
                    </h1>
                    <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 mt-1">
                        解決香港人每一餐嘅終極選擇困難症
                    </p>
                </div>

                <!-- Mode Switcher Segmented Control -->
                <div class="grid grid-cols-2 gap-2 bg-gray-100 dark:bg-gray-800 p-1.5 rounded-xl border-2 border-brand-ink dark:border-gray-200 mb-2">
                    <button id="mode-single-btn" onclick="setMode('single')" class="py-2.5 px-3 rounded-lg font-extrabold text-sm flex items-center justify-center gap-1.5 border-2 border-brand-ink bg-brand-coral text-white shadow-neo-sm transition-all">
                        <span>🙋</span> 單人速選
                    </button>
                    <button id="mode-two-btn" onclick="setMode('two_player')" class="py-2.5 px-3 rounded-lg font-bold text-sm text-gray-700 dark:text-gray-300 flex items-center justify-center gap-1.5 border-2 border-transparent hover:bg-gray-200 dark:hover:bg-gray-700 transition-all">
                        <span>💑</span> 雙人配對
                    </button>
                </div>
                
                <p id="mode-desc" class="text-xs text-center font-medium text-brand-coral dark:text-amber-400 bg-brand-coral/10 dark:bg-amber-400/10 p-2 rounded-lg border border-brand-coral/30">
                    💡 獨自滑卡揀心水，仲可以「⚡即刻拍板」或者最後「🎲擲骰揀」！
                </p>
            </div>

            <!-- Filters Ticket Container -->
            <div class="bg-white dark:bg-brand-cardDark border-2 border-brand-ink dark:border-gray-100 p-5 rounded-2xl shadow-neo dark:shadow-neo-dark flex-1 flex flex-col justify-between gap-4">
                
                <div class="space-y-4">
                    <div class="flex items-center justify-between border-b-2 border-dashed border-gray-300 dark:border-gray-700 pb-2">
                        <span class="font-extrabold text-base flex items-center gap-1.5">
                            <span>🎫</span> 篩選你的食欲 Ticket
                        </span>
                        <span class="text-xs font-mono font-bold text-gray-400">HK_DINING_V2.5</span>
                    </div>

                    <!-- Filter 1: MTR Station Dropdown -->
                    <div>
                        <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1.5">
                            📍 港鐵站 / 地區區域
                        </label>
                        <select id="station-select" class="w-full bg-gray-50 dark:bg-gray-800 font-bold border-2 border-brand-ink dark:border-gray-300 text-brand-ink dark:text-white text-sm rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-brand-coral shadow-[0_2px_0_#18181B] dark:shadow-[0_2px_0_#FFF]">
                            <option value="ALL">全港隨機 (Random All HK)</option>
                            <option value="荃灣">荃灣 (Tsuen Wan)</option>
                            <option value="葵芳">葵芳 (Kwai Fong)</option>
                            <option value="旺角">旺角 (Mong Kok)</option>
                            <option value="佐敦">佐敦 (Jordan)</option>
                            <option value="尖沙咀">尖沙咀 (Tsim Sha Tsui)</option>
                            <option value="深水埗">深水埗 (Sham Shui Po)</option>
                            <option value="太子">太子 (Prince Edward)</option>
                            <option value="中環">中環 (Central)</option>
                            <option value="灣仔">灣仔 (Wan Chai)</option>
                            <option value="銅鑼灣">銅鑼灣 (Causeway Bay)</option>
                            <option value="元朗">元朗 (Yuen Long)</option>
                        </select>
                    </div>

                    <!-- Filter 2: Budget Range Slider -->
                    <div>
                        <div class="flex justify-between items-center mb-1.5">
                            <label class="text-xs font-bold text-gray-700 dark:text-gray-300">
                                💵 人均預算上限 (Budget Limit)
                            </label>
                            <span id="budget-val-display" class="font-mono font-extrabold text-sm text-brand-coral dark:text-amber-400 bg-brand-coral/10 dark:bg-amber-400/10 px-2 py-0.5 rounded border border-brand-coral/30">
                                $300 以內
                            </span>
                        </div>
                        
                        <!-- Quick Budget Pills -->
                        <div class="grid grid-cols-4 gap-1.5 mb-3">
                            <button onclick="setBudgetPreset(80)" class="budget-pill py-1 text-xs font-bold border-2 border-brand-ink rounded-lg bg-gray-100 dark:bg-gray-800 dark:border-gray-300 hover:bg-brand-coral/20">平民 $80</button>
                            <button onclick="setBudgetPreset(150)" class="budget-pill py-1 text-xs font-bold border-2 border-brand-ink rounded-lg bg-gray-100 dark:bg-gray-800 dark:border-gray-300 hover:bg-brand-coral/20">中價 $150</button>
                            <button onclick="setBudgetPreset(300)" class="budget-pill py-1 text-xs font-bold border-2 border-brand-ink rounded-lg bg-brand-coral text-white border-brand-ink shadow-[0_2px_0_#18181B]">約會 $300</button>
                            <button onclick="setBudgetPreset(1000)" class="budget-pill py-1 text-xs font-bold border-2 border-brand-ink rounded-lg bg-gray-100 dark:bg-gray-800 dark:border-gray-300 hover:bg-brand-coral/20">無上限</button>
                        </div>

                        <input type="range" id="budget-slider" min="40" max="1000" step="20" value="300" oninput="updateBudgetValue(this.value)" class="w-full h-2.5 bg-gray-200 dark:bg-gray-700 rounded-lg appearance-none cursor-pointer accent-brand-coral">
                    </div>

                    <!-- Filter 3: Deck Size Pills -->
                    <div>
                        <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1.5">
                            🃏 抽卡數量 (Deck Size)
                        </label>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="setDeckSize(6)" id="deck-6-btn" class="deck-btn py-2 text-xs font-extrabold border-2 border-brand-ink rounded-xl bg-gray-100 dark:bg-gray-800 transition-all">⚡ 6 張 (速選)</button>
                            <button onclick="setDeckSize(8)" id="deck-8-btn" class="deck-btn py-2 text-xs font-extrabold border-2 border-brand-ink rounded-xl bg-brand-coral text-white shadow-[0_2px_0_#18181B] transition-all">🎯 8 張 (推薦)</button>
                            <button onclick="setDeckSize(10)" id="deck-10-btn" class="deck-btn py-2 text-xs font-extrabold border-2 border-brand-ink rounded-xl bg-gray-100 dark:bg-gray-800 transition-all">🍱 10 張 (精選)</button>
                        </div>
                    </div>
                </div>

                <!-- Start CTA Button -->
                <button id="start-game-btn" onclick="startGame()" class="w-full btn-neo bg-brand-coral text-white text-lg font-black py-4 rounded-xl flex items-center justify-center gap-2 hover:bg-brand-coralHover transition-all mt-2">
                    <span>🃏 開始單人速選！</span>
                </button>
            </div>
        </main>

        <!-- SCREEN 2: INTERACTIVE CARD SWIPE STAGE -->
        <main id="screen-swipe" class="hidden flex-1 flex flex-col justify-between gap-3 relative">
            
            <!-- Progress & Player Bar -->
            <div class="bg-white dark:bg-brand-cardDark border-2 border-brand-ink dark:border-gray-100 p-3 rounded-xl shadow-neo-sm dark:shadow-neo-sm-dark flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span id="player-badge" class="bg-brand-coral text-white text-xs font-black px-2.5 py-1 rounded-lg border border-brand-ink flex items-center gap-1">

                    </span>
                    <span id="progress-counter" class="font-mono text-xs font-extrabold text-gray-600 dark:text-gray-300">
                        第 1 / 8 張
                    </span>
                </div>
                
                <div class="flex items-center gap-1 text-xs font-black text-brand-teal bg-brand-tealLight border border-brand-teal/40 px-2.5 py-1 rounded-lg">
                    <span>♥ 已留低:</span>
                    <span id="live-keep-count" class="font-mono text-sm font-extrabold">0</span>
                </div>
            </div>

            <!-- Card Stack Container -->
            <div id="deck-container" class="relative w-full flex-1 min-h-[380px] max-h-[460px] my-auto flex items-center justify-center">
                <!-- Stack cards rendered dynamically via JS -->
            </div>

            <!-- Tactile Action Bar -->
            <div class="space-y-2">
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="triggerSwipe('ban')" class="btn-neo bg-brand-rose text-white py-3.5 rounded-xl font-black text-sm flex items-center justify-center gap-1 hover:brightness-105 active:scale-95 transition-all">
                        <span>✕ 唔食</span>
                    </button>
                    
                    <button id="btn-undo" onclick="undoSwipe()" class="btn-neo bg-gray-100 text-brand-ink dark:bg-gray-800 dark:text-white py-3.5 rounded-xl font-extrabold text-xs flex flex-col items-center justify-center hover:bg-gray-200 active:scale-95 transition-all">
                        <span class="flex items-center gap-1">↩️ 撤回</span>
                        <span id="undo-count-label" class="text-[10px] text-gray-500 dark:text-gray-400 font-normal">剩餘 2 次</span>
                    </button>

                    <button onclick="triggerSwipe('keep')" class="btn-neo bg-brand-teal text-white py-3.5 rounded-xl font-black text-sm flex items-center justify-center gap-1 hover:brightness-105 active:scale-95 transition-all">
                        <span>♥ 留低</span>
                    </button>
                </div>

                <!-- Single Player Extra Lock Button -->
                <button id="btn-instant-lock" onclick="triggerInstantLock()" class="w-full btn-neo bg-amber-400 text-brand-ink font-black py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 hover:bg-amber-300 transition-all">
                    <span>⚡ 唔洗再滑，即刻拍板食呢間！ (Swipe Up / Click)</span>
                </button>
                
                <p class="text-[10px] text-center font-bold text-gray-400 dark:text-gray-500">
                    💡 提示：支援 ⬅️ Left (Ban) | ➡️ Right (Keep) | ⬆️ Up (Instant) | Z (Undo) 鍵盤操作
                </p>
            </div>
        </main>

        <!-- SCREEN 3: ANTI-PEEK HANDOFF SCREEN (Two-Player Mode Only) -->
        <main id="screen-handoff" class="hidden flex-1 flex flex-col justify-center items-center gap-6 text-center">
            <div class="bg-white dark:bg-brand-cardDark border-2 border-brand-ink dark:border-gray-100 p-6 rounded-2xl shadow-neo dark:shadow-neo-dark w-full space-y-5">
                <div class="text-6xl animate-bounce">🙈</div>
                
                <div>
                    <h2 class="text-2xl font-black text-brand-ink dark:text-white">
                        Player A 已完成揀選！
                    </h2>
                    <p class="text-xs text-gray-500 dark:text-gray-400 font-semibold mt-1">
                        秘密保護中！請將手機交畀 <span class="text-brand-coral font-bold">Player B</span> 繼續滑卡。
                    </p>
                </div>

                <div class="bg-amber-50 dark:bg-amber-950/40 border-2 border-dashed border-amber-400 p-3 rounded-xl">
                    <span class="text-xs font-bold text-amber-800 dark:text-amber-300">
                        🔒 Player A 已神秘留低咗 <span id="player-a-kept-count" class="font-mono text-base font-extrabold">0</span> 間餐廳！
                    </span>
                </div>

                <button onclick="startPlayerBTurn()" class="w-full btn-neo bg-brand-coral text-white font-black text-base py-4 rounded-xl flex items-center justify-center gap-2 hover:bg-brand-coralHover transition-all">
                    <span>👋 我係 Player B，開始滑卡！</span>
                </button>
            </div>
        </main>

        <!-- SCREEN 4: RESULT & FINAL RESOLUTION STAGE -->
        <main id="screen-results" class="hidden flex-1 flex flex-col justify-between gap-4">
            
            <!-- Result Banner Header -->
            <div id="result-header-card" class="bg-white dark:bg-brand-cardDark border-2 border-brand-ink dark:border-gray-100 p-4 rounded-2xl shadow-neo dark:shadow-neo-dark text-center">
                <!-- Injected via JS -->
            </div>

            <!-- Result Cards List / Winner Showcase -->
            <div id="result-content-area" class="flex-1 space-y-3 overflow-y-auto max-h-[50vh] pr-1">
                <!-- Injected dynamically via JS -->
            </div>

            <!-- Bottom Action Controls -->
            <div id="result-bottom-actions" class="space-y-2">
                <!-- Injected dynamically via JS -->
            </div>
        </main>

    </div>

    <!-- JAVASCRIPT APP LOGIC -->

        /* ==========================================================================
           2. APP STATE MANAGEMENT
           ========================================================================== */
        const state = {
            mode: 'single', // 'single' | 'two_player'
            screen: 'setup', // 'setup' | 'swipe' | 'handoff' | 'results'
            currentPlayer: 'playerA', // 'single' | 'playerA' | 'playerB'
            
            // Filter options
            station: 'ALL',
            maxBudget: 300,
            deckSize: 8,

            // Active Game Deck & Choices
            deck: [],
            currentIndex: 0,
            
            // Player Choices arrays holding restaurant IDs
            playerAChoices: { keep: [], ban: [], instant: null },
            playerBChoices: { keep: [], ban: [] },

            // Undo Stack (Max 2 undos per player turn)
            undoStack: [],
            maxUndosPerTurn: 2,
            currentTurnUndoCount: 0
        };

        /* ==========================================================================
           3. SOUND EFFECTS SYNTHESIZER (Web Audio API)
           ========================================================================== */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'swipe_keep') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.12);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'swipe_ban') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(150, now + 0.12);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'instant') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'win') {
                    // Fanfare chords
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.type = 'triangle';
                        o.frequency.setValueAtTime(freq, now + idx * 0.08);
                        g.gain.setValueAtTime(0.12, now + idx * 0.08);
                        g.gain.linearRampToValueAtTime(0.01, now + idx * 0.08 + 0.3);
                        o.start(now + idx * 0.08);
                        o.stop(now + idx * 0.08 + 0.3);
                    });
                }
            } catch (e) {
                console.error('Audio playback error', e);
            }
        }

        /* ==========================================================================
           4. DARK MODE TOGGLE
           ========================================================================== */
        function toggleDarkMode() {
            playSound('click');
            document.documentElement.classList.toggle('dark');
        }

        /* ==========================================================================
           5. SETUP SCREEN CONTROLS & FILTERING
           ========================================================================== */
        function setMode(mode) {
            playSound('click');
            state.mode = mode;
            const singleBtn = document.getElementById('mode-single-btn');
            const twoBtn = document.getElementById('mode-two-btn');
            const modeDesc = document.getElementById('mode-desc');
            const startBtn = document.getElementById('start-game-btn');

            if (mode === 'single') {
                singleBtn.className = "py-2.5 px-3 rounded-lg font-extrabold text-sm flex items-center justify-center gap-1.5 border-2 border-brand-ink bg-brand-coral text-white shadow-neo-sm transition-all";

                modeDesc.innerHTML = "💡 獨自滑卡揀心水，仲可以「⚡即刻拍板」或者最後「🎲擲骰揀」！";
                startBtn.innerHTML = "<span>🃏 開始單人速選！</span>";
            } else {
                twoBtn.className = "py-2.5 px-3 rounded-lg font-extrabold text-sm flex items-center justify-center gap-1.5 border-2 border-brand-ink bg-brand-coral text-white shadow-neo-sm transition-all";
                singleBtn.className = "py-2.5 px-3 rounded-lg font-bold text-sm text-gray-700 dark:text-gray-300 flex items-center justify-center gap-1.5 border-2 border-transparent hover:bg-gray-200 dark:hover:bg-gray-700 transition-all";
                modeDesc.innerHTML = "💡 兩位同機輪流滑卡（防窺視），自動比對心水交集配對！";
                startBtn.innerHTML = "<span>💑 開始雙人配對！</span>";
            }
        }

        function updateBudgetValue(val) {
            state.maxBudget = parseInt(val);
            const display = document.getElementById('budget-val-display');
            display.innerText = val >= 1000 ? '$1000+ (無上限)' : `$${val} 以內`;
        }

        function setBudgetPreset(val) {
            playSound('click');
            const slider = document.getElementById('budget-slider');
            slider.value = val;
            updateBudgetValue(val);
        }

        function setDeckSize(size) {
            playSound('click');
            state.deckSize = size;
            [6, 8, 10].forEach(s => {
                const btn = document.getElementById(`deck-${s}-btn`);
                if (s === size) {
                    btn.className = "deck-btn py-2 text-xs font-extrabold border-2 border-brand-ink rounded-xl bg-brand-coral text-white shadow-[0_2px_0_#18181B] transition-all";
                } else {
                    btn.className = "deck-btn py-2 text-xs font-extrabold border-2 border-brand-ink rounded-xl bg-gray-100 dark:bg-gray-800 transition-all";
                }
            });
        }

        /* ==========================================================================
           6. GAME INITIALIZATION
           ========================================================================== */
        function startGame() {
            playSound('click');
            state.station = document.getElementById('station-select').value;
            
            // Filter pool by Station and Budget
            let filtered = HK_RESTAURANTS.filter(r => {
                const matchStation = (state.station === 'ALL' || r.station === state.station);
                const matchBudget = (r.price <= state.maxBudget || state.maxBudget >= 1000);
                return matchStation && matchBudget;
            });

            // Fallback padding: If filtered count is smaller than requested deck size,
            // gracefully pad with random restaurants from full list to fulfill requested size
            if (filtered.length < state.deckSize) {
                const remain = HK_RESTAURANTS.filter(r => !filtered.some(f => f.id === r.id));
                const shuffledRemain = [...remain].sort(() => 0.5 - Math.random());
                filtered = [...filtered, ...shuffledRemain.slice(0, state.deckSize - filtered.length)];
            }

            // Shuffle filtered deck
            state.deck = filtered.sort(() => 0.5 - Math.random()).slice(0, state.deckSize);
            
            // Reset state
            state.currentIndex = 0;
            state.playerAChoices = { keep: [], ban: [], instant: null };
            state.playerBChoices = { keep: [], ban: [] };
            state.undoStack = [];
            state.currentTurnUndoCount = 0;

            if (state.mode === 'single') {
                state.currentPlayer = 'single';
            } else {
                state.currentPlayer = 'playerA';
            }

            // Show Swipe Screen
            switchScreen('swipe');
            renderDeck();
            updateSwipeHeader();
        }

        function switchScreen(targetScreen) {
            state.screen = targetScreen;
            document.getElementById('screen-setup').classList.add('hidden');
            document.getElementById('screen-swipe').classList.add('hidden');
            document.getElementById('screen-handoff').classList.add('hidden');
            document.getElementById('screen-results').classList.add('hidden');

            document.getElementById(`screen-${targetScreen}`).classList.remove('hidden');

            const backBtn = document.getElementById('btn-back-setup');
            if (targetScreen === 'setup') {
                backBtn.classList.add('hidden');
            } else {
                backBtn.classList.remove('hidden');
            }
        }

        function resetToSetup() {
            playSound('click');
            switchScreen('setup');
        }

        /* ==========================================================================
           7. DECK RENDERING & CARD INTERACTION (SWIPE GESTURES)
           ========================================================================== */
        function updateSwipeHeader() {
            const badge = document.getElementById('player-badge');
            const progress = document.getElementById('progress-counter');
            const liveKeep = document.getElementById('live-keep-count');
            const instantBtn = document.getElementById('btn-instant-lock');

            if (state.mode === 'single') {
                badge.innerHTML = "🙋 單人速選";
                badge.className = "bg-brand-coral text-white text-xs font-black px-2.5 py-1 rounded-lg border border-brand-ink flex items-center gap-1";
                liveKeep.innerText = state.playerAChoices.keep.length;
                instantBtn.classList.remove('hidden');
            } else {
                instantBtn.classList.add('hidden');
                if (state.currentPlayer === 'playerA') {
                    badge.innerHTML = "👤 Player A";
                    badge.className = "bg-indigo-600 text-white text-xs font-black px-2.5 py-1 rounded-lg border border-brand-ink flex items-center gap-1";
                    liveKeep.innerText = state.playerAChoices.keep.length;
                } else {
                    badge.innerHTML = "👤 Player B";
                    badge.className = "bg-pink-600 text-white text-xs font-black px-2.5 py-1 rounded-lg border border-brand-ink flex items-center gap-1";
                    liveKeep.innerText = state.playerBChoices.keep.length;
                }
            }

            progress.innerText = `第 ${Math.min(state.currentIndex + 1, state.deckSize)} / ${state.deckSize} 張`;
            
            // Undo count display update
            const undoLabel = document.getElementById('undo-count-label');
            const remainingUndos = state.maxUndosPerTurn - state.currentTurnUndoCount;
            undoLabel.innerText = `剩餘 ${Math.max(0, remainingUndos)} 次`;
        }

        function renderDeck() {
            const container = document.getElementById('deck-container');
            container.innerHTML = '';

            if (state.currentIndex >= state.deck.length) {
                // Turn Finished!
                handleTurnComplete();
                return;
            }

            // Render top 2 cards (current active card + underneath preview card)
            const remainingCount = state.deck.length - state.currentIndex;
            const renderLimit = Math.min(2, remainingCount);

            for (let i = renderLimit - 1; i >= 0; i--) {
                const item = state.deck[state.currentIndex + i];
                const cardEl = createCardElement(item, i === 0);
                
                if (i === 1) {
                    // Scale down background preview card

        /* ==========================================================================
           8. TOUCH & MOUSE DRAG DRIVER
           ========================================================================== */
        function attachCardGestureListeners(card) {
            let isDragging = false;
            let startX = 0;
            let startY = 0;
            let currentX = 0;
            let currentY = 0;

            const stampKeep = card.querySelector('.stamp-keep');
            const stampBan = card.querySelector('.stamp-ban');
            const stampInstant = card.querySelector('.stamp-instant');

            function onStart(e) {
                isDragging = true;
                card.classList.add('dragging');
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                startX = clientX;
                startY = clientY;
            }

            function onMove(e) {
                if (!isDragging) return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                currentX = clientX - startX;
                currentY = clientY - startY;

                const rotate = currentX * 0.08;
                card.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${rotate}deg)`;

                // Opacity feedback for Stamps
                const threshold = 80;
                if (currentX > 20) {
                    stampKeep.style.opacity = Math.min(1, currentX / threshold);
                    stampBan.style.opacity = 0;
                    if (stampInstant) stampInstant.style.opacity = 0;
                } else if (currentX < -20) {
                    stampBan.style.opacity = Math.min(1, Math.abs(currentX) / threshold);
                    stampKeep.style.opacity = 0;
                    if (stampInstant) stampInstant.style.opacity = 0;
                } else if (currentY < -40 && state.mode === 'single') {
                    if (stampInstant) stampInstant.style.opacity = Math.min(1, Math.abs(currentY) / threshold);
                    stampKeep.style.opacity = 0;
                    stampBan.style.opacity = 0;
                } else {
                    stampKeep.style.opacity = 0;
                    stampBan.style.opacity = 0;
                    if (stampInstant) stampInstant.style.opacity = 0;
                }
            }

            function onEnd() {
                if (!isDragging) return;
                isDragging = false;
                card.classList.remove('dragging');

                const swipeThreshold = 100;
                const upThreshold = -120;

                if (currentX > swipeThreshold) {
                    executeCardSwipe(card, 'keep', currentX);
                } else if (currentX < -swipeThreshold) {
                    executeCardSwipe(card, 'ban', currentX);
                } else if (currentY < upThreshold && state.mode === 'single') {
                    executeCardSwipe(card, 'instant', 0, currentY);
                } else {
                    // Reset card position
                    card.style.transform = '';
                    stampKeep.style.opacity = 0;
                    stampBan.style.opacity = 0;
                    if (stampInstant) stampInstant.style.opacity = 0;
                }
            }

            // Mouse Events
            card.addEventListener('mousedown', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);

            // Touch Events
            card.addEventListener('touchstart', onStart, { passive: true });
            window.addEventListener('touchmove', onMove, { passive: true });
            window.addEventListener('touchend', onEnd);
        }

        function triggerSwipe(decision) {
            const container = document.getElementById('deck-container');
            const topCard = container.querySelector('.z-20');
            if (topCard) {
                const dirX = decision === 'keep' ? 300 : -300;
                executeCardSwipe(topCard, decision, dirX);
            }
        }

        function triggerInstantLock() {
            if (state.mode !== 'single') return;
            const container = document.getElementById('deck-container');
            const topCard = container.querySelector('.z-20');
            if (topCard) {
                executeCardSwipe(topCard, 'instant', 0, -400);
            }
        }

        function executeCardSwipe(cardEl, decision, deltaX = 0, deltaY = 0) {
            const currentItem = state.deck[state.currentIndex];
            
            // Sound effect
            if (decision === 'keep') playSound('swipe_keep');
            else if (decision === 'ban') playSound('swipe_ban');
            else if (decision === 'instant') playSound('instant');

            // Save state into undo stack
            state.undoStack.push({
                index: state.currentIndex,
                decision: decision,
                item: currentItem
            });

            // Record Decision
            if (state.currentPlayer === 'playerA' || state.currentPlayer === 'single') {
                if (decision === 'keep') state.playerAChoices.keep.push(currentItem.id);
                else if (decision === 'ban') state.playerAChoices.ban.push(currentItem.id);
                else if (decision === 'instant') state.playerAChoices.instant = currentItem.id;
            } else {
                if (decision === 'keep') state.playerBChoices.keep.push(currentItem.id);
                else if (decision === 'ban') state.playerBChoices.ban.push(currentItem.id);
            }

            // Animate Card Out
            let targetX = deltaX > 0 ? 500 : (deltaX < 0 ? -500 : 0);
            let targetY = deltaY < 0 ? -600 : 0;
            let targetRotate = targetX * 0.1;

            cardEl.style.transform = `translate(${targetX}px, ${targetY}px) rotate(${targetRotate}deg)`;
            cardEl.style.opacity = '0';

            setTimeout(() => {
                if (decision === 'instant' && state.mode === 'single') {
                    // Instant Lock immediately finishes the game!
                    showResults('instant_win', currentItem);
                } else {
                    state.currentIndex++;
                    renderDeck();
                }
            }, 200);
        }

        function undoSwipe() {
            if (state.undoStack.length === 0) return;
            if (state.currentTurnUndoCount >= state.maxUndosPerTurn) {
                alert('⚠️ 每輪最多只能撤回 2 次喔！');
                return;
            }

            playSound('click');
            const last = state.undoStack.pop();
            state.currentTurnUndoCount++;

            // Remove choice
            if (state.currentPlayer === 'playerA' || state.currentPlayer === 'single') {
                if (last.decision === 'keep') {
                    state.playerAChoices.keep = state.playerAChoices.keep.filter(id => id !== last.item.id);
                } else if (last.decision === 'ban') {
                    state.playerAChoices.ban = state.playerAChoices.ban.filter(id => id !== last.item.id);
                }
            } else {
                if (last.decision === 'keep') {
                    state.playerBChoices.keep = state.playerBChoices.keep.filter(id => id !== last.item.id);
                } else if (last.decision === 'ban') {
                    state.playerBChoices.ban = state.playerBChoices.ban.filter(id => id !== last.item.id);
                }
            }

            state.currentIndex = Math.max(0, state.currentIndex - 1);
            renderDeck();
        }

        // Keyboard Shortcuts Handler
        document.addEventListener('keydown', (e) => {
            if (state.screen !== 'swipe') return;
            if (e.key === 'ArrowLeft') triggerSwipe('ban');
            else if (e.key === 'ArrowRight') triggerSwipe('keep');
            else if (e.key === 'ArrowUp' && state.mode === 'single') triggerInstantLock();
            else if (e.key === 'z' || e.key === 'Z') undoSwipe();
        });

        /* ==========================================================================
           9. TWO-PLAYER HANDOFF LOGIC
           ========================================================================== */
        function handleTurnComplete() {
            if (state.mode === 'single') {
                calculateResults();
            } else {
                if (state.currentPlayer === 'playerA') {
                    // Player A finished -> Show Anti-Peek Handoff Screen
                    document.getElementById('player-a-kept-count').innerText = state.playerAChoices.keep.length;
                    switchScreen('handoff');
                } else {
                    // Player B finished -> Calculate Final Mutual Matches
                    calculateResults();
                }
            }
        }

        function startPlayerBTurn() {
            playSound('click');
            state.currentPlayer = 'playerB';
            state.currentIndex = 0;
            state.undoStack = [];
            state.currentTurnUndoCount = 0;
            
            switchScreen('swipe');
            renderDeck();
        }

        /* ==========================================================================
           10. RESULT RESOLUTION & DICE ROLLING MECHANIC
           ========================================================================== */
        function calculateResults() {
            switchScreen('results');

            if (state.mode === 'single') {
                const keptIds = state.playerAChoices.keep;
                if (keptIds.length === 0) {
                    showResults('single_zero');
                } else if (keptIds.length === 1) {
                    const winner = HK_RESTAURANTS.find(r => r.id === keptIds[0]);
                    showResults('single_winner', winner);
                } else {
                    const keptList = HK_RESTAURANTS.filter(r => keptIds.includes(r.id));
                    showResults('single_multiple', keptList);
                }
            } else {
                // Two-Player Matching
                const keptA = state.playerAChoices.keep;
                const keptB = state.playerBChoices.keep;
                const mutualIds = keptA.filter(id => keptB.includes(id));

                if (mutualIds.length === 0) {
                    // 0 Mutual Matches -> Combined blind pool option
                    const combinedIds = Array.from(new Set([...keptA, ...keptB]));
                    const combinedList = HK_RESTAURANTS.filter(r => combinedIds.includes(r.id));
                    showResults('two_zero', combinedList);
                } else if (mutualIds.length === 1) {
                    const winner = HK_RESTAURANTS.find(r => r.id === mutualIds[0]);
                    showResults('two_winner', winner);
                } else {
                    const mutualList = HK_RESTAURANTS.filter(r => mutualIds.includes(r.id));
                    showResults('two_multiple', mutualList);
                }
            }
        }

                        <p class="text-xs font-bold text-gray-500 dark:text-gray-300">📍 ${randomItem.station} · 💵 約 $${randomItem.price}</p>
                    </div>
                `;

                cycleCount++;
                if (cycleCount >= maxCycles) {
                    clearInterval(interval);
                    const finalWinner = pool[Math.floor(Math.random() * pool.length)];
                    showResults('single_winner', finalWinner);
                }
            }, 100);
        }

        /* ==========================================================================
           11. CANVAS CONFETTI EFFECT
           ========================================================================== */
        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#FF5A36', '#0D9488', '#F59E0B', '#E11D48', '#3B82F6'];

            for (let i = 0; i < 70; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.7) * 16,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 10
                });
            }

            let animationFrame;
            let opacity = 1;

            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.4; // Gravity
                    p.rotation += p.rotationSpeed;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rotation * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                });

                if (particles.some(p => p.y < canvas.height)) {
                    animationFrame = requestAnimationFrame(render);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    cancelAnimationFrame(animationFrame);
                }
            }

            render();
        }

        // Initialize App on window load
        window.onload = function() {
            updateBudgetValue(300);
        };
    </script>
